<style>.vml{--vml-bg:#F3F7FF;--vml-card:#FFFFFF;--vml-ink:#0F1F3D;--vml-mute:#55667F;--vml-line:#DFE8F5;--vml-acc:#1F6BFF;--vml-acc-soft:#E8F1FF;--vml-past:#B7D3FF;--vml-fut:#E4ECF8;

.vml *{box-sizing:border-box}
.vml-root{height:100%;overflow-y:auto}
.vml main{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.vml h1{font-size:1.9rem;line-height:1.2;margin:.4rem 0;letter-spacing:-.02em}
.vml h2{font-size:1.05rem;font-weight:700;margin:0 0 .7rem;letter-spacing:-.01em}
.vml .vml-card{background:var(--vml-card);border:1px solid var(--vml-line);border-radius:22px;padding:20px;margin:14px 0;display:block;box-shadow:var(--vml-shadow)}
.vml .vml-mute{color:var(--vml-mute);font-size:.88rem}

.vml .vml-ring circle{fill:none;stroke-width:11}
.vml .vml-ring-bg{stroke:var(--vml-fut)}.vml .vml-ring-fg{stroke:var(--vml-acc);stroke-linecap:round}
.vml .vml-ring-text{position:absolute;inset:0;display:grid;place-content:center;text-align:center}

.vml .vml-bar{height:10px;border-radius:6px;background:var(--vml-fut);overflow:hidden;margin:0}
.vml .vml-bar i{display:block;height:100%;background:var(--vml-acc);border-radius:6px}
.vml .vml-votes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}

.vml .vml-btn.vml-ghost{background:var(--vml-acc-soft);color:var(--vml-ink)}
.vml .vml-btn:disabled{opacity:.45;cursor:not-allowed}
.vml :focus-visible{outline:3px solid var(--vml-acc);outline-offset:2px}
.vml .vml-scroll{overflow-x:auto;max-width:100%;border-radius:12px}.vml canvas{display:block;cursor:pointer}
.vml .vml-legend{font-size:.8rem;margin-top:12px;gap:12px;color:var(--vml-mute)}.vml .vml-legend span{display:flex;gap:6px;align-items:center}
.vml .vml-legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.vml .vml-year{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px}
.vml .vml-d{aspect-ratio:1;border:0;border-radius:7px;background:var(--vml-past);padding:0;cursor:pointer;min-height:24px}
.vml .vml-d.f{background:var(--vml-fut)}.vml .vml-d.t{box-shadow:0 0 0 2px var(--vml-ink)}

.vml .vml-seg{display:inline-flex;background:var(--vml-bg);border-radius:14px;padding:4px;gap:2px;margin-bottom:14px}

.vml .vml-stat{background:var(--vml-bg);border-radius:16px;padding:14px}

        "ชมรมต้องการปรับกิจกรรมให้ตรงกับรูปแบบที่สมาชิกอยากเข้าร่วมจริง และเปิดโอกาสให้สมาชิกทุกกลุ่มแสดงความคิดเห็น",
      purpose: "กำหนดรูปแบบกิจกรรมหลักของชมรมในเดือนถัดไป",
    },
    "ควรเปลี่ยนวันประชุมทีมประจำสัปดาห์เป็นวันไหน?": {
      creator: "ทีมผลิตภัณฑ์",
      detail:
        "เวลาประชุมปัจจุบันเริ่มไม่สะดวกสำหรับสมาชิกบางส่วน ทีมจึงต้องการหาช่วงเวลาที่กระทบตารางงานของคนน้อยที่สุด",
      purpose: "กำหนดวันประชุมประจำสัปดาห์ที่สมาชิกส่วนใหญ่เข้าร่วมได้",
    },
    "ควรเปิดให้โหวตงบประมาณเล็กๆ ของเขตผ่านแอปทุกไตรมาสหรือไม่?": {
      creator: "เขตเมืองใหม่",
      detail:
        "เขตกำลังศึกษารูปแบบงบประมาณแบบมีส่วนร่วม และต้องการทราบว่าประชาชนเห็นด้วยกับการเปิดโหวตผ่านแอปบ่อยเพียงใด",
      purpose: "ประเมินความต้องการก่อนทดลองระบบโหวตงบประมาณของเขต",
    },
  };

  var styleText = [
    "[data-public-vote-page] > div:first-child{position:relative;overflow:hidden;padding:18px;border-radius:24px;background:linear-gradient(135deg,var(--vote-accent),var(--vote-accent-2));box-shadow:0 14px 32px rgb(31 107 255 / 22%)}",
    "[data-public-vote-page] > div:first-child:after{content:'';position:absolute;width:120px;height:120px;right:-48px;top:-70px;border-radius:999px;background:rgb(255 255 255 / 16%)}",
    "[data-public-vote-page] > div:first-child h2,[data-public-vote-page] > div:first-child p{color:white!important}",
    "[data-public-vote-page] > div:first-child button{position:relative;background:white!important;color:var(--vote-accent)!important;box-shadow:0 6px 18px rgb(15 31 61 / 16%)}",
    "[data-public-vote-card]{--card-accent:var(--vote-accent);position:relative;overflow:hidden;background:linear-gradient(155deg,color-mix(in srgb,var(--card-accent) 9%,var(--vote-surface)) 0%,var(--vote-surface) 42%)!important;border-color:color-mix(in srgb,var(--card-accent) 28%,var(--vote-border))!important}",
    "[data-public-vote-card]:before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:var(--card-accent)}",
    "[data-public-vote-card='1']{--card-accent:#1f6bff}",
    "[data-public-vote-card='2']{--card-accent:#0b76b8}",
    "[data-public-vote-card='3']{--card-accent:#4f5fe0}",
    "[data-public-vote-card='4']{--card-accent:#0b7f57}",
    "[data-vote-creator]{display:flex;align-items:center;gap:7px;margin-top:-2px;padding:7px 9px;border-radius:12px;background:color-mix(in srgb,var(--card-accent,var(--vote-accent)) 9%,transparent);color:var(--vote-muted);font-size:10px;font-weight:700}",
    "[data-vote-creator] svg{width:14px;height:14px;flex:none;color:var(--card-accent,var(--vote-accent))}",
    "[data-vote-creator] strong{color:var(--vote-text);font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}",
    "[data-vote-detail]{position:relative;overflow:hidden;padding:16px;border:1px solid var(--vote-accent-border);border-radius:20px;background:linear-gradient(145deg,var(--vote-accent-soft),color-mix(in srgb,var(--vote-accent-2) 8%,var(--vote-surface)))}",
    "[data-vote-detail]:before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(var(--vote-accent),var(--vote-accent-2))}",
    "[data-vote-detail] .vote-detail-title{display:flex;align-items:center;gap:7px;margin:0 0 7px;color:var(--vote-accent);font-size:12px;font-weight:800}",
    "[data-vote-detail] .vote-detail-title svg{width:16px;height:16px;flex:none}",
    "[data-vote-detail] .vote-detail-copy{margin:0;color:var(--vote-text);font-size:12px;line-height:1.65}",
    "[data-vote-detail] .vote-purpose{margin-top:11px;padding-top:10px;border-top:1px solid var(--vote-accent-border);color:var(--vote-muted);font-size:11px;line-height:1.55}",
    "[data-vote-detail] .vote-purpose strong{color:var(--vote-accent)}",
    "[data-extra-battles]{display:grid;gap:10px}",
    "[data-extra-battles] .extra-battles-heading{display:flex;align-items:center;justify-content:space-between;padding:0 3px}",
    "[data-extra-battles] .extra-battles-heading strong{color:var(--vote-text);font-size:13px;font-weight:800}",
    "[data-extra-battles] .extra-battles-heading span{color:var(--vote-muted);font-size:10px;font-weight:700}",
    "[data-extra-battle]{--battle-a:#1f6bff;--battle-b:#0a8579;position:relative;overflow:hidden;padding:15px;border:1px solid var(--vote-border);border-radius:22px;background:var(--vote-surface);box-shadow:0 6px 20px rgb(15 50 140 / 7%)}",
    "[data-extra-battle='friendly']{--battle-a:#4f5fe0;--battle-b:#0b76b8}",
    "[data-extra-battle='decision']{--battle-a:#0a8579;--battle-b:#1f6bff}",
    "[data-extra-battle] .extra-battle-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}",
    "[data-extra-battle] .extra-battle-tag{display:flex;align-items:center;gap:6px;color:var(--battle-a);font-size:10px;font-weight:800;letter-spacing:.02em}",
    "[data-extra-battle] .extra-battle-tag:before{content:'';width:7px;height:7px;border-radius:999px;background:var(--battle-a);box-shadow:0 0 0 4px color-mix(in srgb,var(--battle-a) 13%,transparent)}",
    "[data-extra-battle] .extra-battle-meta{color:var(--vote-muted);font-size:10px;font-weight:650}",
    "[data-extra-battle] .extra-battle-title{margin:0 0 4px;color:var(--vote-text);font-size:13px;font-weight:800}",
    "[data-extra-battle] .extra-battle-creator{margin:0 0 12px;color:var(--vote-muted);font-size:10px;font-weight:650}",
    "[data-extra-battle] .extra-battle-score{display:flex;height:8px;overflow:hidden;border-radius:999px;background:var(--vote-accent-soft)}",
    "[data-extra-battle] .extra-battle-score span{height:100%;transition:width .35s ease}",
    "[data-extra-battle] .extra-battle-score .side-a{background:var(--battle-a)}",
    "[data-extra-battle] .extra-battle-score .side-b{background:var(--battle-b)}",
    "[data-extra-battle] .extra-battle-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}",
    "[data-extra-battle] .extra-battle-choice{display:flex;align-items:center;justify-content:space-between;gap:5px;min-height:42px;padding:8px 10px;border:1px solid color-mix(in srgb,var(--choice-color) 25%,var(--vote-border));border-radius:14px;background:color-mix(in srgb,var(--choice-color) 7%,var(--vote-surface));color:var(--choice-color);font:inherit;font-size:11px;font-weight:800;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}",
    "[data-extra-battle] .extra-battle-choice:first-child{--choice-color:var(--battle-a)}",
    "[data-extra-battle] .extra-battle-choice:last-child{--choice-color:var(--battle-b)}",
    "[data-extra-battle] .extra-battle-choice:hover{transform:translateY(-1px);box-shadow:0 5px 14px color-mix(in srgb,var(--choice-color) 13%,transparent)}",
    "[data-extra-battle] .extra-battle-choice[aria-pressed='true']{color:white;background:var(--choice-color);border-color:var(--choice-color)}",
    "[data-extra-battle] .extra-battle-choice span:last-child{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px}",
    "@media (hover:hover){[data-public-vote-card]:hover{transform:translateY(-3px);border-color:var(--card-accent)!important;box-shadow:0 12px 28px color-mix(in srgb,var(--card-accent) 16%,transparent)!important}}",
  ].join("");

  var personIcon =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path></svg>';
  var detailIcon =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z"></path><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>';

  function safeText(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function detailFor(question) {
    return (
      voteDetails[question] || {
        creator: "ผู้สร้างโหวต",
        detail:
          "ผู้สร้างเปิดโหวตนี้เพื่อรวบรวมความคิดเห็นจากผู้มีส่วนร่วมอย่างโปร่งใส และช่วยให้การตัดสินใจสะท้อนเสียงของคนส่วนใหญ่",
        purpose: "ใช้ผลโหวตเป็นข้อมูลประกอบการตัดสินใจในประเด็นนี้",
      }
    );
  }

  function enhancePublicVotes(doc) {
    var publicHeading = Array.from(doc.querySelectorAll("h2")).find(function (
      heading,
    ) {
      return heading.textContent.trim() === "โหวตสาธารณะ";
    });
    if (!publicHeading) return;

    var page = publicHeading.closest(".space-y-3");
    if (page) page.setAttribute("data-public-vote-page", "true");

    Array.from(page.querySelectorAll("h3")).forEach(function (heading, index) {
      if (heading.closest(".fixed")) return;
      var card = heading.parentElement;
      if (!card || card.hasAttribute("data-public-vote-card")) return;

      var question = heading.textContent.trim();
      var data = detailFor(question);
      card.setAttribute("data-public-vote-card", String((index % 4) + 1));

      var creator = doc.createElement("div");
      creator.setAttribute("data-vote-creator", "true");
      creator.innerHTML =
        personIcon +
        '<span>สร้างโดย</span><strong>' +
        safeText(data.creator) +
        "</strong>";
      heading.insertAdjacentElement("afterend", creator);
    });

    Array.from(doc.querySelectorAll(".fixed h3")).forEach(function (heading) {
      var sheet = heading.closest(".fixed > div");
      if (!sheet || sheet.querySelector("[data-vote-detail]")) return;

      var question = heading.textContent.trim();
      var data = detailFor(question);
      var optionList = Array.from(sheet.querySelectorAll("div")).find(function (
        element,
      ) {
        return (
          element.classList.contains("space-y-2") &&
          element.querySelector("button")
        );
      });
      if (!optionList) return;

      var detail = doc.createElement("section");
      detail.setAttribute("data-vote-detail", "true");
      detail.setAttribute("aria-label", "รายละเอียดโหวต");
      detail.innerHTML =
        '<div class="vote-detail-title">' +
        detailIcon +
        "<span>รายละเอียดโหวต</span></div>" +
        '<p class="vote-detail-copy">' +
        safeText(data.detail) +
        "</p>" +
        '<div class="vote-purpose"><strong>จุดประสงค์:</strong> ' +
        safeText(data.purpose) +
        "</div>";
      optionList.insertAdjacentElement("beforebegin", detail);
    });
  }

  function enhanceBattles(doc) {
    var battleBadge = Array.from(doc.querySelectorAll("span")).find(function (
      element,
    ) {
      return element.textContent.indexOf("BATTLE OF THE DAY") !== -1;
    });
    if (!battleBadge) return;

    var page = battleBadge.closest(".space-y-4");
    if (!page || page.querySelector("[data-extra-battles]")) return;

    var liveCard = Array.from(page.children).find(function (child) {
      return Array.from(child.querySelectorAll("button")).some(function (
        button,
      ) {
        return button.textContent.indexOf("Pulse") !== -1;
      });
    });
    var anchor = liveCard || battleBadge.closest(".rounded-3xl");
    if (!anchor) return;

    var battles = doc.createElement("section");
    battles.setAttribute("data-extra-battles", "true");
    battles.setAttribute("aria-label", "แบทเทิลเพิ่มเติม");
    battles.innerHTML =
      '<div class="extra-battles-heading"><strong>แบทเทิลที่กำลังมาแรง</strong><span>เลือกฝั่งที่ใช่สำหรับคุณ</span></div>' +
      '<article data-extra-battle="friendly" data-a="57" data-b="43">' +
      '<div class="extra-battle-top"><span class="extra-battle-tag">FRIENDLY BATTLE</span><span class="extra-battle-meta">เหลือ 18 นาที · 824 เสียง</span></div>' +
      '<h4 class="extra-battle-title">เครื่องดื่มประจำออฟฟิศควรเป็นอะไร?</h4>' +
      '<p class="extra-battle-creator">สร้างโดย ทีมออฟฟิศฮับ</p>' +
      '<div class="extra-battle-score" aria-label="กาแฟสกัดเย็น 57 เปอร์เซ็นต์ ชาไทย 43 เปอร์เซ็นต์"><span class="side-a" style="width:57%"></span><span class="side-b" style="width:43%"></span></div>' +
      '<div class="extra-battle-actions"><button class="extra-battle-choice" type="button" data-side="a" aria-pressed="false"><span>กาแฟสกัดเย็น</span><span>57%</span></button><button class="extra-battle-choice" type="button" data-side="b" aria-pressed="false"><span>ชาไทย</span><span>43%</span></button></div>' +
      "</article>" +
      '<article data-extra-battle="decision" data-a="64" data-b="36">' +
      '<div class="extra-battle-top"><span class="extra-battle-tag">DECISION BATTLE</span><span class="extra-battle-meta">เหลือ 1 ชม. · 1,206 เสียง</span></div>' +
      '<h4 class="extra-battle-title">พื้นที่ว่างริมแม่น้ำควรพัฒนาเป็นอะไร?</h4>' +
      '<p class="extra-battle-creator">สร้างโดย ชุมชนริมน้ำ</p>' +
      '<div class="extra-battle-score" aria-label="ตลาดนัดชุมชน 64 เปอร์เซ็นต์ สวนกิจกรรม 36 เปอร์เซ็นต์"><span class="side-a" style="width:64%"></span><span class="side-b" style="width:36%"></span></div>' +
      '<div class="extra-battle-actions"><button class="extra-battle-choice" type="button" data-side="a" aria-pressed="false"><span>ตลาดนัดชุมชน</span><span>64%</span></button><button class="extra-battle-choice" type="button" data-side="b" aria-pressed="false"><span>สวนกิจกรรม</span><span>36%</span></button></div>' +
      "</article>";

    battles.addEventListener("click", function (event) {
      var button = event.target.closest(".extra-battle-choice");
      if (!button) return;
      var battle = button.closest("[data-extra-battle]");
      if (!battle || battle.querySelector("[aria-pressed='true']")) return;

      var selectedSide = button.getAttribute("data-side");
      var a = Number(battle.getAttribute("data-a"));
      var b = Number(battle.getAttribute("data-b"));
      if (selectedSide === "a") a += 1;
      else b += 1;
      var total = a + b;
      var aPercent = Math.round((a / total) * 100);
      var bPercent = 100 - aPercent;

      battle.querySelector(".side-a").style.width = aPercent + "%";
      battle.querySelector(".side-b").style.width = bPercent + "%";
      var choices = battle.querySelectorAll(".extra-battle-choice");
      choices[0].querySelector("span:last-child").textContent = aPercent + "%";
      choices[1].querySelector("span:last-child").textContent = bPercent + "%";
      button.setAttribute("aria-pressed", "true");
    });

    anchor.insertAdjacentElement("afterend", battles);
  }

  function enhance(doc) {
    enhancePublicVotes(doc);
    enhanceBattles(doc);
  }

  function connect() {
    var frame = document.getElementById("voteframe");
    if (!frame || !frame.contentDocument) return;
    var doc = frame.contentDocument;
    if (!doc.getElementById("public-vote-enhancement-styles")) {
      var style = doc.createElement("style");
      style.id = "public-vote-enhancement-styles";
      style.textContent = styleText;
      doc.head.appendChild(style);
    }
    enhance(doc);
    new MutationObserver(function () {
      enhance(doc);
    }).observe(doc.body, { childList: true, subtree: true });
  }

  var frame = document.getElementById("voteframe");
  if (frame) {
    frame.addEventListener("load", connect);
    if (frame.contentDocument && frame.contentDocument.readyState === "complete")
      connect();
  }
})();
</script></body>
</html>
